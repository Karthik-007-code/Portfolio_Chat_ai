[project]
name = "portfolio-chat-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "karthik", email = "karthikankipalli007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openai>=3.49.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
portfolio-chat-ai = "portfolio_chat_ai:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
